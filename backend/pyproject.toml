[project]
name = "cressey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Teddy", email = "102239127+Onsraa@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.13",
    "boto3>=1.43.111",
    "detect-secrets>=1.5.0",
    "fastapi>=0.143.0",
    "fastmcp>=4.1.0",
    "fonttools>=4.66.1",
    "numpy>=2.5.3",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "pyyaml>=6.0.3",
    "sqlglot>=30.22.0",
    "sse-starlette>=3.5.0",
    "typesafe-sdk>=0.7.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
cressey = "cressey:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: calls real APIs"]
testpaths = ["tests"]
